# Scheduled health checks for the infrastructure in this repo.
# Each check is its own job, so a failure shows exactly what broke.
#
# Current checks:
#   oidc  - GitHub Actions can assume the dev plan role via OIDC (ADR 0005, 0008)
#
# Planned: drift detection (terraform plan -detailed-exitcode) per root module.
name: Infra health

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily (3-4am US Central). Runs from main only.
  workflow_dispatch:
  # schedule and workflow_dispatch only take effect once this file is on the
  # default branch, so also run on any PR that changes it.
  pull_request:
    paths:
      - .github/workflows/infra-health.yml
      - .github/actions/terraform-setup/**

permissions:
  id-token: write # lets jobs request a GitHub OIDC token
  contents: read

jobs:
  oidc:
    name: OIDC auth (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # needed to use the local setup action

      # Same login path the PR plan job uses, so this nightly run catches
      # anything that would break plans (trust policy, OIDC provider, repo var).
      - uses: ./.github/actions/terraform-setup
        with:
          role: steel-ledger-dev-plan
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Show assumed identity
        run: aws sts get-caller-identity
